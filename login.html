<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión — Toolbox IA</title>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      color-scheme: light;
      --ink: #111827;
      --muted: #6b7280;
      --line: #d1d5db;
      --brand: #2563eb;
      --brand-dark: #1d4ed8;
      --danger-bg: #fef2f2;
      --danger: #b91c1c;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f9fafb;
    }
    .page { display: grid; min-height: 100vh; place-items: center; padding: 24px; }
    .shell { width: min(100%, 430px); }
    .form-panel { width: 100%; }
    .form-wrap { width: 100%; }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 42px; font-size: 1.05rem; font-weight: 700; letter-spacing: -.02em; }
    .brand-icon { display: grid; width: 34px; height: 34px; place-items: center; border-radius: 10px; color: white; background: #111827; }
    .form-heading { display: block; }
    .form-heading h2 { margin: 0; font-size: 1.8rem; letter-spacing: -.04em; }
    .lock { display: none; }
    .subtitle { margin: 8px 0 30px; color: var(--muted); line-height: 1.6; }
    .input-label { display: block; margin: 0 0 9px; color: var(--ink); font-size: .875rem; font-weight: 600; }
    .field { position: relative; }
    input {
      width: 100%;
      height: 52px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      outline: none;
      color: var(--ink);
      background: white;
      font: inherit;
      transition: border-color .2s, box-shadow .2s;
    }
    input:focus { border-color: var(--brand); box-shadow: 0 0 0 4px rgba(37, 99, 235, .14); }
    .field + .input-label, form > .input-label:nth-of-type(2) { margin-top: 21px; }
    .toggle-password { position: absolute; top: 50%; right: 7px; display: grid; width: 38px; height: 38px; place-items: center; transform: translateY(-50%); border: 0; border-radius: 8px; color: var(--muted); background: transparent; cursor: pointer; }
    button { font: inherit; cursor: pointer; }
    .primary, .google { width: 100%; height: 52px; border-radius: 10px; font-weight: 650; transition: background .2s, box-shadow .2s; }
    .primary { margin-top: 24px; border: 0; color: white; background: var(--brand); box-shadow: 0 5px 12px rgba(37, 99, 235, .2); }
    .primary:hover { background: var(--brand-dark); }
    .google { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 12px; border: 1px solid var(--line); color: var(--ink); background: white; }
    .google:hover { background: #f3f4f6; }
    .divider { display: flex; align-items: center; gap: 12px; margin: 24px 0 2px; color: #9ca3af; font-size: .78rem; }
    .divider::before, .divider::after { content: ""; height: 1px; flex: 1; background: var(--line); }
    .status { display: none; gap: 9px; align-items: flex-start; margin-top: 18px; padding: 12px 14px; border-radius: 10px; color: var(--danger); background: var(--danger-bg); font-size: .86rem; line-height: 1.45; }
    .status.visible { display: flex; }
    .status.loading { color: #1e40af; background: #eff6ff; }
    .footnote { margin-top: 28px; color: var(--muted); font-size: .78rem; line-height: 1.6; text-align: center; }
    @media (max-width: 480px) { .page { padding: 22px; } .brand { margin-bottom: 34px; } }
  </style>
</head>
<body>
  <main class="page">
    <section class="shell" aria-label="Acceso a Toolbox IA">
      <div class="form-panel">
        <div class="form-wrap">
          <div class="brand">
            <span class="brand-icon"><i data-lucide="wrench" width="18"></i></span>
            <span>Toolbox IA</span>
          </div>
          <div class="form-heading">
            <h2>Inicia sesión</h2>
          </div>
          <p class="subtitle">Accede a tu biblioteca de automatizaciones.</p>
          <form id="loginForm" novalidate>
            <label class="input-label" for="email">Correo electrónico</label>
            <input id="email" type="email" autocomplete="email" placeholder="nombre@correo.com" required>
            <label class="input-label" for="password">Contraseña</label>
            <div class="field">
              <input id="password" type="password" autocomplete="current-password" placeholder="••••••••" required>
              <button id="togglePassword" class="toggle-password" type="button" aria-label="Mostrar contraseña"><i data-lucide="eye" width="18"></i></button>
            </div>
            <button id="loginButton" class="primary" type="submit">Iniciar sesión</button>
          </form>
          <div class="divider">o continúa con</div>
          <button id="googleButton" class="google" type="button" aria-label="Continuar con Google">
            <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="#4285F4" d="M21.35 12.23c0-.71-.06-1.4-.18-2.05H12v3.88h5.24a4.48 4.48 0 0 1-1.94 2.94v2.45h3.14c1.84-1.69 2.91-4.18 2.91-7.22Z"/>
              <path fill="#34A853" d="M12 21.75c2.63 0 4.84-.87 6.45-2.35l-3.14-2.45c-.87.58-1.98.92-3.31.92-2.54 0-4.69-1.72-5.46-4.03H3.3v2.53A9.75 9.75 0 0 0 12 21.75Z"/>
              <path fill="#FBBC05" d="M6.54 13.84a5.86 5.86 0 0 1 0-3.68V7.63H3.3a9.75 9.75 0 0 0 0 8.74l3.24-2.53Z"/>
              <path fill="#EA4335" d="M12 6.13c1.43 0 2.72.49 3.73 1.46l2.8-2.8C16.84 3.23 14.63 2.25 12 2.25a9.75 9.75 0 0 0-8.7 5.38l3.24 2.53C7.31 7.85 9.46 6.13 12 6.13Z"/>
            </svg>
            Continuar con Google
          </button>
          <div id="status" class="status" role="status" aria-live="polite"></div>
          <p class="footnote">El acceso requiere una cuenta creada por el administrador.</p>
        </div>
      </div>
    </section>
  </main>
  <script>
    const AUTHORIZED_EMAIL = "banquezbetancourt15@gmail.com";
    const SUPABASE_URL = "https://wzrvcioskqwixclbalzd.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_i4YoocPM-VP4VodsO_lzBQ__Mxq77po";
    const PUBLIC_APP_URL = "https://aj-banquez.github.io/AW-CODE/";
    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
    const form = document.getElementById("loginForm");
    const email = document.getElementById("email");
    const password = document.getElementById("password");
    const status = document.getElementById("status");
    const loginButton = document.getElementById("loginButton");

    lucide.createIcons();

    function showStatus(message, loading = false) {
      status.className = `status visible${loading ? " loading" : ""}`;
      status.innerHTML = `<i data-lucide="${loading ? "loader-circle" : "info"}" width="17"></i><span>${message}</span>`;
      lucide.createIcons();
    }

    function clearStatus() {
      status.className = "status";
      status.textContent = "";
    }

    function isAuthorized(user) {
      return Boolean(user?.email);
    }

    async function finishSession(user) {
      if (!isAuthorized(user)) {
        await client.auth.signOut();
        showStatus("No se pudo identificar el usuario. Inicia sesión nuevamente.");
        return false;
      }
      window.location.replace("index.html#dashboard");
      return true;
    }

    client.auth.getSession().then(({ data }) => {
      if (data.session) finishSession(data.session.user);
    });

    form.addEventListener("submit", async event => {
      event.preventDefault();
      clearStatus();
      if (!email.value.trim() || !password.value) {
        showStatus("Escribe tu correo y contraseña para continuar.");
        return;
      }
      loginButton.disabled = true;
      showStatus("Verificando tus credenciales...", true);
      const { data, error } = await client.auth.signInWithPassword({
        email: email.value.trim(),
        password: password.value
      });
      loginButton.disabled = false;
      if (error) {
        showStatus("No se pudo iniciar sesión. Revisa tus datos e inténtalo de nuevo.");
        return;
      }
      await finishSession(data.user);
    });

    document.getElementById("googleButton").addEventListener("click", async () => {
      clearStatus();
      showStatus("Conectando con Google...", true);
      const { error } = await client.auth.signInWithOAuth({
        provider: "google",
        options: { redirectTo: PUBLIC_APP_URL }
      });
      if (error) {
        const providerDisabled = error.message.toLowerCase().includes("provider is not enabled");
        showStatus(
          providerDisabled
            ? "Google todavía no está habilitado en Supabase. Actívalo en Authentication > Providers > Google."
            : "No se pudo conectar con Google. Inténtalo de nuevo."
        );
      }
    });

    document.getElementById("togglePassword").addEventListener("click", event => {
      const button = event.currentTarget;
      const visible = password.type === "text";
      password.type = visible ? "password" : "text";
      button.setAttribute("aria-label", visible ? "Mostrar contraseña" : "Ocultar contraseña");
      button.innerHTML = `<i data-lucide="${visible ? "eye" : "eye-off"}" width="18"></i>`;
      lucide.createIcons();
    });
  </script>
</body>
</html>
